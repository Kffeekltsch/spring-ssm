# Real Audio Codec Configuration
# Train on a single WAV file

run_name: "codec-audio-s5"
project_name: "ssm-codec"
output_dir: "codec/runs"
use_wandb: false

data:
  wav_path: audio_inference.wav    # Path to WAV file
  segment_length: 1000        # ~23ms at 44.1kHz
  sample_rate: 44100           # Match native sample rate
  train_val_split: 0.8        # 80% train, 20% val

model:
  d_state: 64                 # SSM state dimension
  d_hidden: 64                # Hidden dimension for encoder and decoder
  n_encoder_layers: 2         # Encoder S5 layers
  n_decoder_layers: 3         # Decoder S5 layers — needs more capacity to generate waveform
  n_quantization_levels: 32   # 5 bits/dim
  decoder_type: "s5"          # Pure S5 decoder — symmetric to encoder
  # Bitrate: 2*64*5/1000 = 0.64 bits/sample = 28.2 kbps @ 44.1kHz

training:
  epochs: 500
  batch_size: 32              # Smaller batch = more gradient updates per epoch
  learning_rate: 3.0e-4       # Lower LR for stability
  weight_decay: 1.0e-3        # Stronger regularization to prevent overfitting
  warmup_epochs: 10
  quant_warmup_epochs: 30     # Longer warmup — let encoder+decoder converge first
  scheduler_patience: 30      # More patience — let it explore
  scheduler_factor: 0.5

loss:
  alpha_spectral: 0.0         # OFF — pure MSE until SNR > 0
  alpha_vq: 0.0
  time_loss_type: mse
