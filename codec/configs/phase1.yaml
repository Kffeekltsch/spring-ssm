# Phase 1: Single sinusoids — the litmus test
# 
# Compression budget analysis:
#   Input: 1600 samples × 16 bits = 25,600 bits
#   Bottleneck: 2 × d_state × bits_per_dim
#   With d_state=16, 32 levels: 2×16×5 = 160 bits → 160:1 compression
#   
#   The analytical decoder produces: y(t) = Re[Σ Cᵢ · λᵢᵗ · h₀ᵢ]
#   Each eigenvalue = 1 decaying sinusoid.
#   d_state=16 → 16 sinusoidal components (enough for harmonic signals)

run_name: "codec-phase1-analytical"
project_name: "ssm-codec"
output_dir: "codec/runs"
use_wandb: false

data:
  phase: 1               # single sinusoids only
  segment_length: 1600   # 0.1s at 16kHz
  sample_rate: 16000
  n_train: 8000
  n_val: 1000
  n_test: 1000

model:
  d_state: 16            # 16 complex eigenvalues — can represent 16 sinusoidal components
  d_hidden: 64           # Processing capacity (4× d_state)
  n_encoder_layers: 3
  n_decoder_layers: 1
  n_quantization_levels: 32     # 5 bits per dim → 2*16*5 = 160 bits/segment
  decoder_type: "analytical"

training:
  epochs: 200
  batch_size: 64
  learning_rate: 3.0e-4         # Lower LR — more stable
  weight_decay: 1.0e-4
  warmup_epochs: 10
  quant_warmup_epochs: 30       # 30 epochs continuous → then enable quantization
  scheduler_patience: 20
  scheduler_factor: 0.5

loss:
  alpha_spectral: 0.0           # Pure MSE for phase 1 — sines don't need spectral loss
  alpha_vq: 0.0
